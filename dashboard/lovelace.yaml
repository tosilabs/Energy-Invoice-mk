# ============================================================
#  Energy Invoice MK — Lovelace Dashboard
#  Consumer: Fatos  |  EVN Macedonia  |  v1.1.0
# ============================================================
#
# SETUP (run once in HA → Settings → Devices & Services → Helpers):
#
#   1. Create helper: input_datetime.evn_calc_start
#        Type: Date and/or time  |  Date only: ON
#
#   2. Create helper: input_datetime.evn_calc_end
#        Type: Date and/or time  |  Date only: ON
#
#   3. Create helper: input_text.evn_calc_result
#        Name: EVN Calc Result  |  Max length: 255
#
#   4. Create Script (Settings → Automations → Scripts → Add Script):
#        Alias:  evn_calculate_period
#        ID:     evn_calculate_period
#        ---
#        sequence:
#          - action: energy_invoice_mk.calculate_period
#            data:
#              start_date: "{{ states('input_datetime.evn_calc_start') }}"
#              end_date:   "{{ states('input_datetime.evn_calc_end') }}"
#            response_variable: result
#          - action: input_text.set_value
#            target:
#              entity_id: input_text.evn_calc_result
#            data:
#              value: >
#                VT: {{ result.vt_consumption | round(2) }} kWh |
#                NT: {{ result.nt_consumption | round(2) }} kWh |
#                Total: {{ result.total_cost | round(2) }} MKD
#
# ============================================================

title: "⚡ EVN Fatos"
path: evn-fatos

cards:

  # ── 1. PERIOD HEADER ────────────────────────────────────────
  - type: markdown
    content: >
      ## ⚡ EVN Македонија — Тековен период
      **Период:**
      {{ state_attr('sensor.fatos_total_bill_current_period', 'period_start') or '—' }}
      →
      {{ state_attr('sensor.fatos_total_bill_current_period', 'period_end') or '—' }}

  # ── 2. TOTAL BILL GAUGE ──────────────────────────────────────
  - type: gauge
    entity: sensor.fatos_total_bill_current_period
    name: Вкупна сметка
    unit: MKD
    min: 0
    max: 10000
    severity:
      green: 0
      yellow: 3000
      red: 6000
    needle: true

  # ── 3. CONSUMPTION SUMMARY ───────────────────────────────────
  - type: glance
    title: Потрошувачка (тековен период)
    columns: 3
    entities:
      - entity: sensor.fatos_vt_consumption_current_period
        name: VT (висока)
      - entity: sensor.fatos_nt_consumption_current_period
        name: NT (ниска)
      - entity: sensor.fatos_total_consumption_current_period
        name: Вкупно

  # ── 4. BILL BREAKDOWN ────────────────────────────────────────
  - type: entities
    title: Разбивка на сметка
    show_header_toggle: false
    entities:
      - entity: sensor.fatos_vt_energy_cost
        name: Енергија VT
        icon: mdi:lightning-bolt
      - entity: sensor.fatos_nt_energy_cost
        name: Енергија NT
        icon: mdi:lightning-bolt-outline
      - entity: sensor.fatos_energy_cost_vt_nt
        name: Енергија (VT+NT)
        icon: mdi:sigma
      - type: divider
      - entity: sensor.fatos_transmission_distribution_cost
        name: Пренос + Дистрибуција
        icon: mdi:transmission-tower
      - type: section
        label: Фиксни трошоци
      - entity: sensor.fatos_vat_18
        name: ДДВ (18%)
        icon: mdi:percent
      - entity: sensor.fatos_total_bill_current_period
        name: ВКУПНА СМЕТКА
        icon: mdi:receipt

  # ── 5. ESTIMATES ─────────────────────────────────────────────
  - type: glance
    title: Проценки
    columns: 2
    entities:
      - entity: sensor.fatos_estimated_monthly_bill
        name: Проценка месечна
        icon: mdi:calendar-month
      - entity: sensor.fatos_daily_average_cost
        name: Дневен просек
        icon: mdi:calendar-today

  # ── 6. HISTORY ───────────────────────────────────────────────
  - type: entities
    title: Историја
    show_header_toggle: false
    entities:
      - type: section
        label: Последни 30 дена
      - entity: sensor.fatos_last_30_days_consumption
        name: Потрошувачка (30 дена)
        icon: mdi:calendar-range
      - entity: sensor.fatos_last_30_days_cost
        name: Трошок (30 дена)
        icon: mdi:cash
      - type: section
        label: Претходен период
      - entity: sensor.fatos_previous_billing_period_consumption
        name: Потрошувачка
        icon: mdi:history
      - entity: sensor.fatos_previous_billing_period_cost
        name: Трошок
        icon: mdi:cash-minus
      - type: section
        label: Оваа година
      - entity: sensor.fatos_this_year_consumption
        name: Потрошувачка
        icon: mdi:chart-line
      - entity: sensor.fatos_this_year_cost
        name: Трошок
        icon: mdi:bank

  # ── 7. HISTORY GRAPH ─────────────────────────────────────────
  - type: history-graph
    title: Потрошувачка — последни 7 дена
    hours_to_show: 168
    entities:
      - entity: sensor.fatos_vt_consumption_current_period
        name: VT
      - entity: sensor.fatos_nt_consumption_current_period
        name: NT
      - entity: sensor.fatos_total_consumption_current_period
        name: Вкупно

  # ── 8. PERIOD CALCULATOR ─────────────────────────────────────
  - type: vertical-stack
    cards:
      - type: markdown
        content: "## 🔢 Калкулатор за период"

      # Shortcut buttons
      - type: horizontal-stack
        cards:
          - type: button
            name: "Последни 30 дена"
            icon: mdi:calendar-range
            tap_action:
              action: call-service
              service: script.evn_set_last_30_days
          - type: button
            name: "Претходен месец"
            icon: mdi:calendar-arrow-left
            tap_action:
              action: call-service
              service: script.evn_set_previous_month
          - type: button
            name: "Оваа година"
            icon: mdi:calendar-star
            tap_action:
              action: call-service
              service: script.evn_set_this_year

      # Date pickers
      - type: entities
        entities:
          - entity: input_datetime.evn_calc_start
            name: Почетна дата
            icon: mdi:calendar-start
          - entity: input_datetime.evn_calc_end
            name: Крајна дата
            icon: mdi:calendar-end

      # Calculate button
      - type: button
        name: "Пресметај сметка"
        icon: mdi:calculator
        show_name: true
        show_icon: true
        tap_action:
          action: call-service
          service: script.evn_calculate_period

      # Result display
      - type: entities
        entities:
          - entity: input_text.evn_calc_result
            name: Резултат
            icon: mdi:text-box-outline

  # ── 9. DIAGNOSTICS (collapsed) ───────────────────────────────
  - type: entities
    title: Дијагностика (напредно)
    show_header_toggle: false
    state_color: false
    entities:
      - entity: sensor.fatos_total_bill_current_period
        name: Дијагностика (атрибути)
        icon: mdi:bug
