# ============================================================
#  Energy Invoice MK — Lovelace Dashboard
#  Consumer: Fatos  |  EVN Macedonia  |  v1.1.0
# ============================================================
#
# SETUP — krijo këto para se ta shtosh dashboardin:
#
#   1. Settings → Devices & Services → Helpers → Add Helper
#      • input_datetime  ID: evn_calc_start    (Date only)
#      • input_datetime  ID: evn_calc_end      (Date only)
#      • input_text      ID: evn_calc_result   (Max: 255)
#
#   2. Settings → Automations → Scripts → Add Script
#      Shto 4 skriptet nga skedari ha_scripts.yaml
#
# ============================================================

title: "⚡ EVN Fatos"
path: evn-fatos

cards:

  # ── 1. PERIOD HEADER ────────────────────────────────────────
  - type: markdown
    content: |
      ## ⚡ EVN Maqedoni — Periudha aktuale
      **Periudha:**
      {{ state_attr('sensor.fatos_total_bill_current_period', 'period_start') or '—' }}
      →
      {{ state_attr('sensor.fatos_total_bill_current_period', 'period_end') or '—' }}
      &nbsp;·&nbsp;
      **{{ state_attr('sensor.fatos_total_bill_current_period', 'days_in_period') or '—' }} ditë**

  # ── 2. TOTAL BILL GAUGE ──────────────────────────────────────
  - type: gauge
    entity: sensor.fatos_total_bill_current_period
    name: Fatura totale
    unit: MKD
    min: 0
    max: 10000
    severity:
      green: 0
      yellow: 3000
      red: 6000
    needle: true

  # ── 3. CONSUMPTION SUMMARY ───────────────────────────────────
  - type: glance
    title: Konsumi (periudha aktuale)
    columns: 3
    entities:
      - entity: sensor.fatos_vt_consumption_current_period
        name: VT (e lartë)
      - entity: sensor.fatos_nt_consumption_current_period
        name: NT (e ulët)
      - entity: sensor.fatos_total_consumption_current_period
        name: Gjithsej

  # ── 4. VT BLOCK PROGRESS BARS ────────────────────────────────
  - type: markdown
    title: "⚡ Blloku VT — Ku jam tani"
    content: |
      {% set vt  = states('sensor.fatos_vt_consumption_current_period') | float(0) %}
      {% set b1  = state_attr('sensor.fatos_total_bill_current_period', 'vt_block1_kwh') | float(0) %}
      {% set b2  = state_attr('sensor.fatos_total_bill_current_period', 'vt_block2_kwh') | float(0) %}
      {% set b3  = state_attr('sensor.fatos_total_bill_current_period', 'vt_block3_kwh') | float(0) %}
      {% set b4  = state_attr('sensor.fatos_total_bill_current_period', 'vt_block4_kwh') | float(0) %}
      {% set f1  = ([b1 / 210  * 24, 24] | min) | int %}
      {% set f2  = ([b2 / 420  * 24, 24] | min) | int %}
      {% set f3  = ([b3 / 420  * 24, 24] | min) | int %}
      {% set f4  = ([b4 / 420  * 24, 24] | min) | int %}

      ---

      {% if vt < 210 %}### 🟢 Blloku 1 — AKTIV{% else %}### Blloku 1 — ✅ Mbushur{% endif %}
      **0 – 210 kWh &nbsp;·&nbsp; 4.71 MKD/kWh**
      {% for i in range(24) %}{{ '█' if i < f1 else '░' }}{% endfor %} **{{ b1 | round(2) }} / 210 kWh**
      {% if vt < 210 %}
      ➡ **{{ (210 - vt) | round(2) }} kWh mbeten deri Blloku 2**
      {% endif %}

      ---

      {% if vt >= 210 and vt < 630 %}### 🟡 Blloku 2 — AKTIV{% elif b2 > 0 %}### Blloku 2 — ✅ Mbushur{% else %}### Blloku 2 — ⬜ Jo aktiv ende{% endif %}
      **211 – 630 kWh &nbsp;·&nbsp; 5.90 MKD/kWh**
      {% for i in range(24) %}{{ '█' if i < f2 else '░' }}{% endfor %} **{{ b2 | round(2) }} / 420 kWh**
      {% if vt >= 210 and vt < 630 %}
      ➡ **{{ (630 - vt) | round(2) }} kWh mbeten deri Blloku 3**
      {% endif %}

      ---

      {% if vt >= 630 and vt < 1050 %}### 🔴 Blloku 3 — AKTIV{% elif b3 > 0 %}### Blloku 3 — ✅ Mbushur{% else %}### Blloku 3 — ⬜ Jo aktiv ende{% endif %}
      **631 – 1050 kWh &nbsp;·&nbsp; 7.85 MKD/kWh**
      {% for i in range(24) %}{{ '█' if i < f3 else '░' }}{% endfor %} **{{ b3 | round(2) }} / 420 kWh**
      {% if vt >= 630 and vt < 1050 %}
      ➡ **{{ (1050 - vt) | round(2) }} kWh mbeten deri Blloku 4**
      {% endif %}

      ---

      {% if vt >= 1050 %}### 🚨 Blloku 4 — AKTIV (çmim maksimal!){% else %}### Blloku 4 — ⬜ Jo aktiv ende{% endif %}
      **> 1050 kWh &nbsp;·&nbsp; 19.19 MKD/kWh**
      {% if b4 > 0 %}
      {% for i in range(24) %}{{ '█' if i < f4 else '░' }}{% endfor %} **{{ b4 | round(2) }} kWh**
      {% else %}
      ░░░░░░░░░░░░░░░░░░░░░░░░ 0 kWh
      {% endif %}

  # ── 5. BILL BREAKDOWN ────────────────────────────────────────
  - type: entities
    title: Ndarja e faturës
    show_header_toggle: false
    entities:
      - entity: sensor.fatos_vt_energy_cost
        name: Energji VT
        icon: mdi:lightning-bolt
      - entity: sensor.fatos_nt_energy_cost
        name: Energji NT
        icon: mdi:lightning-bolt-outline
      - entity: sensor.fatos_energy_cost_vt_nt
        name: Energji (VT+NT)
        icon: mdi:sigma
      - type: divider
      - entity: sensor.fatos_transmission_distribution_cost
        name: Transmetim + Shpërndarje
        icon: mdi:transmission-tower
      - type: section
        label: Taksa fikse
      - entity: sensor.fatos_vat_18
        name: TVSH (18%)
        icon: mdi:percent
      - entity: sensor.fatos_total_bill_current_period
        name: FATURA TOTALE
        icon: mdi:receipt

  # ── 6. ESTIMATES ─────────────────────────────────────────────
  - type: glance
    title: Parashikime
    columns: 2
    entities:
      - entity: sensor.fatos_estimated_monthly_bill
        name: Fatura mujore e parash.
        icon: mdi:calendar-month
      - entity: sensor.fatos_daily_average_cost
        name: Mesatare ditore
        icon: mdi:calendar-today

  # ── 7. HISTORY ───────────────────────────────────────────────
  - type: entities
    title: Historia
    show_header_toggle: false
    entities:
      - type: section
        label: 30 ditët e fundit
      - entity: sensor.fatos_last_30_days_consumption
        name: Konsumi (30 ditë)
        icon: mdi:calendar-range
      - entity: sensor.fatos_last_30_days_cost
        name: Kostoja (30 ditë)
        icon: mdi:cash
      - type: section
        label: Periudha e mëparshme
      - entity: sensor.fatos_previous_billing_period_consumption
        name: Konsumi
        icon: mdi:history
      - entity: sensor.fatos_previous_billing_period_cost
        name: Kostoja
        icon: mdi:cash-minus
      - type: section
        label: Këtë vit
      - entity: sensor.fatos_this_year_consumption
        name: Konsumi
        icon: mdi:chart-line
      - entity: sensor.fatos_this_year_cost
        name: Kostoja
        icon: mdi:bank

  # ── 8. HISTORY GRAPH ─────────────────────────────────────────
  - type: history-graph
    title: Konsumi — 7 ditët e fundit
    hours_to_show: 168
    entities:
      - entity: sensor.fatos_vt_consumption_current_period
        name: VT
      - entity: sensor.fatos_nt_consumption_current_period
        name: NT
      - entity: sensor.fatos_total_consumption_current_period
        name: Gjithsej

  # ── 9. PERIOD CALCULATOR ─────────────────────────────────────
  - type: vertical-stack
    cards:
      - type: markdown
        content: "## 🔢 Kalkulator periudhe"

      - type: horizontal-stack
        cards:
          - type: button
            name: "30 ditët e fundit"
            icon: mdi:calendar-range
            tap_action:
              action: call-service
              service: script.evn_set_last_30_days
          - type: button
            name: "Muaji i kaluar"
            icon: mdi:calendar-arrow-left
            tap_action:
              action: call-service
              service: script.evn_set_previous_month
          - type: button
            name: "Këtë vit"
            icon: mdi:calendar-star
            tap_action:
              action: call-service
              service: script.evn_set_this_year

      - type: entities
        entities:
          - entity: input_datetime.evn_calc_start
            name: Data fillimit
            icon: mdi:calendar-start
          - entity: input_datetime.evn_calc_end
            name: Data mbarimit
            icon: mdi:calendar-end

      - type: button
        name: "Llogarit faturën"
        icon: mdi:calculator
        show_name: true
        show_icon: true
        tap_action:
          action: call-service
          service: script.evn_calculate_period

      - type: entities
        entities:
          - entity: input_text.evn_calc_result
            name: Rezultati
            icon: mdi:text-box-outline

  # ── 10. DIAGNOSTICS ──────────────────────────────────────────
  - type: entities
    title: Diagnostikë (e avancuar)
    show_header_toggle: false
    state_color: false
    entities:
      - entity: sensor.fatos_total_bill_current_period
        name: Atributet diagnostikuese
        icon: mdi:bug
